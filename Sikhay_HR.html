<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sikhay HR</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="SikhayDB.js"></script>
  <style>
    :root {
      --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e; --border:#2a2a2a;
      --amber:#f59e0b; --green:#22c55e; --danger:#ef4444; --muted:#6b7280; --text:#f1f5f9;
      --danger-tint:#ef444418; --danger-border:#ef444440;
      --amber-tint:#f59e0b18;  --amber-border:#f59e0b40;
      --green-tint:#22c55e18;  --green-border:#22c55e40;
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;}

    /* HEADER */
    .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;}
    .logo-box{width:36px;height:36px;background:var(--amber);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#000;flex-shrink:0;}
    .header-title{font-size:16px;font-weight:800;letter-spacing:.5px;}
    .header-sub{font-size:11px;color:var(--muted);margin-top:1px;}
    .back-link{margin-left:auto;color:var(--muted);text-decoration:none;font-size:12px;display:flex;align-items:center;gap:5px;}
    .back-link:hover{color:var(--text);}

    /* TABS */
    .tab-bar{display:flex;border-bottom:1px solid var(--border);padding:0 24px;background:var(--surface);overflow-x:auto;}
    .tab-bar button.tab{background:none;border:none;font-family:inherit;font-size:13px;cursor:pointer;color:var(--muted);padding:12px 16px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:color .15s;}
    .tab-bar button.tab:hover{color:var(--text);}
    .tab-bar button.tab.active{color:var(--amber);border-bottom-color:var(--amber);}

    /* MAIN */
    .main{padding:24px;max-width:1200px;margin:0 auto;}
    .tab-pane{display:none;}
    .tab-pane.active{display:block;}

    /* STATS BAR */
    .stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
    .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
    .stat-value{font-size:24px;font-weight:800;}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:3px;}

    /* SECTION HEADER */
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .section-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:flex;align-items:center;gap:8px;}

    /* TABLE */
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;overflow-x:auto;}
    .data-table{width:100%;border-collapse:collapse;}
    .data-table th{padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
    .data-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tbody tr:hover td{background:var(--surface2);}

    /* PAYROLL INPUTS */
    .pr-input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:inherit;font-size:13px;padding:5px 8px;width:88px;text-align:right;}
    .pr-input:focus{outline:none;border-color:var(--amber);}
    .pr-input:disabled{opacity:.4;cursor:not-allowed;}
    .pr-notes-input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:inherit;font-size:12px;padding:5px 8px;width:180px;min-width:140px;}
    .pr-notes-input:focus{outline:none;border-color:var(--amber);}
    .pr-notes-input::placeholder{color:var(--muted);}
    .pr-notes-input:disabled{opacity:.4;cursor:not-allowed;}
    .net-pay-cell{font-weight:700;color:var(--green);white-space:nowrap;}
    .pr-total-row td{border-top:2px solid var(--border);font-weight:700;background:var(--surface2);}

    /* WEEK NAV */
    .week-nav{display:flex;align-items:center;gap:12px;margin-bottom:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;}
    .week-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;padding:6px 10px;font-size:13px;}
    .week-nav-btn:hover{border-color:var(--amber);color:var(--amber);}
    .week-label{font-size:15px;font-weight:700;flex:1;text-align:center;}

    /* BADGES */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
    .badge-draft{background:var(--amber-tint);color:var(--amber);border:1px solid var(--amber-border);}
    .badge-released{background:var(--green-tint);color:var(--green);border:1px solid var(--green-border);}
    .badge-active{background:var(--green-tint);color:var(--green);border:1px solid var(--green-border);}
    .badge-inactive{background:var(--danger-tint);color:var(--danger);border:1px solid var(--danger-border);}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
    .btn:hover{opacity:.85;}
    .btn-amber{background:var(--amber);color:#000;}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
    .btn-danger{background:var(--danger-tint);color:var(--danger);border:1px solid var(--danger-border);}
    .btn-green{background:var(--green);color:#000;}
    .btn-sm{padding:5px 10px;font-size:12px;}
    .action-bar{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:420px;max-width:95vw;}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
    .form-group{margin-bottom:14px;}
    .form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;display:block;}
    .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:13px;padding:9px 12px;}
    .form-input:focus{outline:none;border-color:var(--amber);}
    .pay-type-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
    .pay-type-btn{flex:1;padding:9px;background:var(--surface2);border:none;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;}
    .pay-type-btn.active{background:var(--amber);color:#000;font-weight:700;}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

    /* PAYSLIP CARDS */
    .payslip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
    .payslip-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s;}
    .payslip-card:hover{border-color:var(--amber);}
    .payslip-name{font-size:14px;font-weight:700;margin-bottom:4px;}
    .payslip-role{font-size:11px;color:var(--muted);margin-bottom:10px;}
    .payslip-net{font-size:20px;font-weight:800;color:var(--green);}
    .payslip-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
    .preview-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
    .week-select{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:inherit;font-size:13px;padding:9px 12px;margin-bottom:20px;width:100%;max-width:340px;}

    /* HISTORY */
    .history-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
    .history-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;}
    .history-head:hover{background:var(--surface2);}
    .history-week{font-size:14px;font-weight:700;flex:1;}
    .history-meta{font-size:12px;color:var(--muted);}
    .history-total{font-size:15px;font-weight:800;color:var(--green);}
    .history-body{display:none;border-top:1px solid var(--border);padding:14px 18px;}
    .history-body.open{display:block;}

    /* CHARTS */
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
    .chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
    .chart-wrap{position:relative;height:210px;}
    .reports-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    @media(max-width:700px){.reports-grid{grid-template-columns:1fr;}}

    /* EMPTY STATE */
    .empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
    .empty-state i{font-size:40px;margin-bottom:12px;display:block;opacity:.4;}

    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:320px;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.err{border-color:var(--danger-border);color:var(--danger);}
    .toast.ok{border-color:var(--green-border);color:var(--green);}

    /* ── LOG-BASED PAYROLL CARDS ── */
    .pr-emp-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
    .pr-emp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface2);}
    .pr-emp-total{font-size:18px;font-weight:800;color:var(--amber);}
    .pr-emp-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap;}
    .pr-emp-net{font-size:16px;font-weight:800;color:var(--green);}
    .pr-log-add{display:none;border-top:1px solid var(--border);}
    .pr-log-add-inner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--surface2);}
  </style>
</head>
<body>

<header class="header">
  <div class="logo-box" aria-hidden="true"><i class="ti ti-users"></i></div>
  <div>
    <div class="header-title">HR Department</div>
    <div class="header-sub">Sikhay Creatives &nbsp;·&nbsp; Sikhay Premium Apparel</div>
  </div>
</header>

<nav class="tab-bar">
  <button class="tab active" onclick="setTab('employees')"><i class="ti ti-users"></i> Employees</button>
  <button class="tab" onclick="setTab('payroll')"><i class="ti ti-calendar-week"></i> Weekly Payroll</button>
  <button class="tab" onclick="setTab('payslips')"><i class="ti ti-file-invoice"></i> Payslips</button>
  <button class="tab" onclick="setTab('history')"><i class="ti ti-history"></i> History</button>
  <button class="tab" onclick="setTab('reports')"><i class="ti ti-chart-bar"></i> Reports</button>
</nav>

<main class="main">
  <div class="tab-pane active" id="pane-employees"></div>
  <div class="tab-pane" id="pane-payroll"></div>
  <div class="tab-pane" id="pane-payslips"></div>
  <div class="tab-pane" id="pane-history"></div>
  <div class="tab-pane" id="pane-reports"></div>
</main>

<!-- EMPLOYEE MODAL -->
<div class="modal-overlay" id="emp-modal">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-user-plus"></i> <span id="modal-title-text">Add Employee</span></div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="emp-name" type="text" placeholder="e.g. Juan Dela Cruz">
    </div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <input class="form-input" id="emp-role" type="text" placeholder="e.g. Printer, Sewer, Finisher">
    </div>
    <div class="form-group">
      <label class="form-label">Pay Type</label>
      <div class="pay-type-toggle">
        <button class="pay-type-btn active" id="pt-daily" onclick="setPayType('daily')">Daily Rate</button>
        <button class="pay-type-btn" id="pt-fixed" onclick="setPayType('fixed')">Fixed Weekly</button>
        <button class="pay-type-btn" id="pt-manual" onclick="setPayType('manual')">Manual</button>
      </div>
    </div>
    <div class="form-group" id="rate-group">
      <label class="form-label" id="rate-label">Daily Rate (₱ per day)</label>
      <input class="form-input" id="emp-rate" type="number" min="0" placeholder="0">
    </div>
    <div class="form-group" id="active-group" style="display:none;">
      <label class="form-label">Status</label>
      <select class="form-input" id="emp-active">
        <option value="true">Active</option>
        <option value="false">Inactive</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Notes / Reminder</label>
      <textarea class="form-input" id="emp-notes" rows="2" placeholder="e.g. SSS voluntary, may utang na ₱500, etc." style="resize:vertical;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEmpModal()">Cancel</button>
      <button class="btn btn-amber" onclick="saveEmployee()"><i class="ti ti-check"></i> Save</button>
    </div>
  </div>
</div>

<!-- PAYSLIP PREVIEW MODAL -->
<div class="modal-overlay" id="payslip-modal">
  <div class="modal" style="width:640px;max-width:95vw;">
    <div id="payslip-preview-content" style="background:white;border-radius:8px;overflow:hidden;max-height:70vh;overflow-y:auto;"></div>
    <div class="preview-actions">
      <button class="btn btn-ghost" onclick="closePayslipModal()"><i class="ti ti-x"></i> Close</button>
      <button class="btn btn-amber" onclick="printCurrentPayslip()"><i class="ti ti-printer"></i> Print</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="tmsg"></span></div>

<script>
// ── CLOUD SYNC ────────────────────────────────────────────────
let _db = null;

// ── CONSTANTS & STATE ─────────────────────────────────────────
const HR_KEY  = 'sikhay_hr_v1';
const FIN_KEY = 'sikhay_fin_v1';

let activeTab         = 'employees';
let curWeekStart      = '';      // ISO date (Monday) of currently viewed payroll week
let editingEmployeeId = null;    // null = add mode, string id = edit mode
let curPayType        = 'daily'; // tracks pay type toggle in modal
let printData         = null;    // { emp, payroll, entry } for current payslip to print

// ── DATA ACCESS ───────────────────────────────────────────────
function getHRData() {
  try { return JSON.parse(localStorage.getItem(HR_KEY)) || { employees: [], payrolls: [] }; }
  catch { return { employees: [], payrolls: [] }; }
}
function saveHRData(data) {
  localStorage.setItem(HR_KEY, JSON.stringify(data));
  if (_db) _db.saveHR(data).catch(() => {});
}

// ── WEEK HELPERS ──────────────────────────────────────────────
function getCurrentMondayISO() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 1=Mon ...
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0, 0, 0, 0);
  return monday.toISOString().split('T')[0];
}

function addDaysISO(isoDate, n) {
  const d = new Date(isoDate + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function formatWeekLabel(start, end) {
  const s = new Date(start + 'T12:00:00');
  const e = new Date(end   + 'T12:00:00');
  const sm = s.toLocaleDateString('en-PH', { month: 'short' });
  const em = e.toLocaleDateString('en-PH', { month: 'short' });
  const sy = s.getFullYear(), ey = e.getFullYear();
  if (sm === em && sy === ey) return `${sm} ${s.getDate()}–${e.getDate()}, ${ey}`;
  if (sy === ey)              return `${sm} ${s.getDate()}–${em} ${e.getDate()}, ${ey}`;
  return `${sm} ${s.getDate()}, ${sy}–${em} ${e.getDate()}, ${ey}`;
}

// ── FINANCE SYNC ──────────────────────────────────────────────
function syncPayrollToFinance(payroll) {
  const entryId = 'hr_' + payroll.id;
  let fin;
  try { fin = JSON.parse(localStorage.getItem(FIN_KEY)) || { expenses: [], orderCosts: [] }; }
  catch { fin = { expenses: [], orderCosts: [] }; }
  fin.expenses = fin.expenses.filter(e => e.id !== entryId);
  if (payroll.status === 'released') {
    fin.expenses.push({
      id:       entryId,
      date:     payroll.weekEnd,
      category: 'Sewing & Labor',
      amount:   payroll.totalNetPay,
      method:   'Cash',
      note:     'Payroll: Week of ' + formatWeekLabel(payroll.weekStart, payroll.weekEnd),
      source:   'hr'
    });
  }
  localStorage.setItem(FIN_KEY, JSON.stringify(fin));
}

// ── UI HELPERS ────────────────────────────────────────────────
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function peso(n) {
  const v = parseFloat(n) || 0;
  return '₱' + v.toLocaleString('en-PH', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
let _toastTimer;
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  document.getElementById('tmsg').textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ── TAB SWITCHING ─────────────────────────────────────────────
function setTab(name) {
  activeTab = name;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-bar button.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  const idx = ['employees','payroll','payslips','history','reports'].indexOf(name);
  document.querySelectorAll('.tab-bar button.tab')[idx].classList.add('active');
  rerenderActive();
}

function rerenderActive() {
  if (activeTab === 'employees') renderEmployees();
  if (activeTab === 'payroll')   renderPayroll();
  if (activeTab === 'payslips')  renderPayslips();
  if (activeTab === 'history')   renderHistory();
  if (activeTab === 'reports')   renderReports();
}

// ── TAB 1: EMPLOYEES ─────────────────────────────────────────
function renderEmployees() {
  const data = getHRData();
  const active = data.employees.filter(e => e.active);
  const estWeekly = active.reduce((s, e) => s + (parseFloat(e.rate) || 0), 0);

  const rows = data.employees.length === 0
    ? `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted);">No employees yet. Add your first employee.</td></tr>`
    : data.employees.map(emp => `
        <tr>
          <td><strong>${esc(emp.name)}</strong>${emp.notes ? `<div style="font-size:11px;color:var(--amber);margin-top:3px;font-style:italic;">📌 ${esc(emp.notes)}</div>` : ''}</td>
          <td style="color:var(--muted)">${esc(emp.role || '—')}</td>
          <td>${emp.payType === 'fixed' ? 'Fixed Weekly' : emp.payType === 'manual' ? 'Manual' : 'Daily Rate'}</td>
          <td>${emp.payType === 'manual' ? peso(emp.rate) + '<span style="font-size:11px;color:var(--muted)"> / total</span>' : peso(emp.rate) + '<span style="font-size:11px;color:var(--muted)"> / ' + (emp.payType === 'fixed' ? 'week' : 'day') + '</span>'}</td>
          <td><span class="badge badge-${emp.active ? 'active' : 'inactive'}">${emp.active ? 'Active' : 'Inactive'}</span></td>
          <td style="white-space:nowrap">
            <button class="btn btn-ghost btn-sm" onclick="openEditEmployee('${emp.id}')"><i class="ti ti-pencil"></i> Edit</button>
          </td>
        </tr>`).join('');

  document.getElementById('pane-employees').innerHTML = `
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Active Employees</div>
        <div class="stat-value">${active.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Est. Weekly Payroll</div>
        <div class="stat-value">${peso(estWeekly)}</div>
        <div class="stat-sub">Sum of all active rates</div>
      </div>
    </div>
    <div class="section-head">
      <div class="section-title"><i class="ti ti-users"></i> Employee Roster</div>
      <button class="btn btn-amber" onclick="openAddEmployee()"><i class="ti ti-user-plus"></i> Add Employee</button>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Name</th><th>Role</th><th>Pay Type</th><th>Rate</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function openAddEmployee() {
  editingEmployeeId = null;
  curPayType = 'daily';
  document.getElementById('modal-title-text').textContent = 'Add Employee';
  document.getElementById('emp-name').value  = '';
  document.getElementById('emp-role').value  = '';
  document.getElementById('emp-rate').value  = '';
  document.getElementById('emp-notes').value = '';
  document.getElementById('active-group').style.display = 'none';
  setPayType('daily');
  document.getElementById('emp-modal').classList.add('open');
}

function openEditEmployee(id) {
  const data = getHRData();
  const emp  = data.employees.find(e => e.id === id);
  if (!emp) return;
  editingEmployeeId = id;
  curPayType = emp.payType;
  document.getElementById('modal-title-text').textContent = 'Edit Employee';
  document.getElementById('emp-name').value   = emp.name;
  document.getElementById('emp-role').value   = emp.role || '';
  document.getElementById('emp-rate').value   = emp.rate;
  document.getElementById('emp-notes').value  = emp.notes || '';
  document.getElementById('emp-active').value = String(emp.active);
  document.getElementById('active-group').style.display = 'block';
  setPayType(emp.payType);
  document.getElementById('emp-modal').classList.add('open');
}

function setPayType(type) {
  curPayType = type;
  document.getElementById('pt-daily').classList.toggle('active', type === 'daily');
  document.getElementById('pt-fixed').classList.toggle('active', type === 'fixed');
  document.getElementById('pt-manual').classList.toggle('active', type === 'manual');
  document.getElementById('rate-group').style.display = '';
  document.getElementById('rate-label').textContent =
    type === 'fixed'  ? 'Fixed Weekly Rate (₱ per week)' :
    type === 'manual' ? 'Total Amount (₱ per week)'      :
                        'Daily Rate (₱ per day)';
}

function saveEmployee() {
  const name  = document.getElementById('emp-name').value.trim();
  const role  = document.getElementById('emp-role').value.trim();
  const rate  = parseFloat(document.getElementById('emp-rate').value) || 0;
  const notes = document.getElementById('emp-notes').value.trim();
  if (!name) { toast('Name is required.', 'err'); return; }

  const data = getHRData();
  if (editingEmployeeId) {
    const idx = data.employees.findIndex(e => e.id === editingEmployeeId);
    if (idx > -1) {
      data.employees[idx].name    = name;
      data.employees[idx].role    = role;
      data.employees[idx].payType = curPayType;
      data.employees[idx].rate    = rate;
      data.employees[idx].notes   = notes;
      data.employees[idx].active  = document.getElementById('emp-active').value === 'true';
    }
    toast('Employee updated.', 'ok');
  } else {
    data.employees.push({ id: uid(), name, role, payType: curPayType, rate, notes, active: true, addedAt: new Date().toISOString().split('T')[0] });
    toast('Employee added.', 'ok');
  }
  saveHRData(data);
  closeEmpModal();
  renderEmployees();
}

function closeEmpModal() {
  document.getElementById('emp-modal').classList.remove('open');
}

// ── LOG PAYROLL HELPERS ───────────────────────────────────────
function calcEmpGross(entry) {
  return (entry.logs || []).reduce((s, l) => s + (parseFloat(l.amount) || 0), 0);
}
function calcEmpNetPay(entry) {
  return Math.max(0, calcEmpGross(entry) - (parseFloat(entry.deduction) || 0));
}

function showLogForm(empId) {
  const el = document.getElementById('log-add-' + empId);
  if (el) el.style.display = 'block';
}
function hideLogForm(empId) {
  const el = document.getElementById('log-add-' + empId);
  if (el) el.style.display = 'none';
}

function addLogEntry(empId) {
  const dateEl   = document.getElementById('log-date-'   + empId);
  const amountEl = document.getElementById('log-amount-' + empId);
  const notesEl  = document.getElementById('log-notes-'  + empId);
  const date     = dateEl?.value   || new Date().toISOString().split('T')[0];
  const amount   = parseFloat(amountEl?.value) || 0;
  const notes    = notesEl?.value.trim() || '';
  if (!amount) { toast('Enter an amount.', 'err'); return; }
  const data = getHRData();
  const idx  = data.payrolls.findIndex(p => p.weekStart === curWeekStart);
  if (idx === -1) return;
  const eIdx = data.payrolls[idx].entries.findIndex(e => e.employeeId === empId);
  if (eIdx === -1) return;
  data.payrolls[idx].entries[eIdx].logs.push({ id: uid(), date, amount, notes });
  saveHRData(data);
  renderPayroll();
}

function deleteLogEntry(empId, logId) {
  if (!confirm('Delete this entry?')) return;
  const data = getHRData();
  const idx  = data.payrolls.findIndex(p => p.weekStart === curWeekStart);
  if (idx === -1) return;
  const eIdx = data.payrolls[idx].entries.findIndex(e => e.employeeId === empId);
  if (eIdx === -1) return;
  data.payrolls[idx].entries[eIdx].logs = data.payrolls[idx].entries[eIdx].logs.filter(l => l.id !== logId);
  saveHRData(data);
  renderPayroll();
}

function saveDeduction(empId, value) {
  const data = getHRData();
  const idx  = data.payrolls.findIndex(p => p.weekStart === curWeekStart);
  if (idx === -1) return;
  const eIdx = data.payrolls[idx].entries.findIndex(e => e.employeeId === empId);
  if (eIdx === -1) return;
  data.payrolls[idx].entries[eIdx].deduction = parseFloat(value) || 0;
  saveHRData(data);
  const entry = data.payrolls[idx].entries[eIdx];
  const netEl = document.getElementById('net-' + empId);
  if (netEl) netEl.textContent = peso(calcEmpNetPay(entry));
  let grandTotal = 0;
  data.payrolls[idx].entries.forEach(e => { grandTotal += calcEmpNetPay(e); });
  const gtEl = document.getElementById('pr-grand-total');
  if (gtEl) gtEl.textContent = peso(grandTotal);
}

// ── TAB 2: WEEKLY PAYROLL ─────────────────────────────────────
function renderPayroll() {
  const data    = getHRData();
  const weekEnd = addDaysISO(curWeekStart, 6);

  let payroll = data.payrolls.find(p => p.weekStart === curWeekStart);
  if (!payroll) {
    const activeEmps = data.employees.filter(e => e.active);
    payroll = {
      id: uid(), weekStart: curWeekStart, weekEnd,
      status: 'draft', releasedAt: null, createdAt: new Date().toISOString(),
      entries: activeEmps.map(e => ({ employeeId: e.id, logs: [], deduction: 0, netPay: 0 })),
      totalNetPay: 0
    };
    data.payrolls.push(payroll);
    saveHRData(data);
  }

  const isReleased = payroll.status === 'released';
  const weekLabel  = formatWeekLabel(payroll.weekStart, payroll.weekEnd);

  const statusBadge = isReleased
    ? `<span class="badge badge-released"><i class="ti ti-check"></i> Released</span>`
    : `<span class="badge badge-draft"><i class="ti ti-pencil"></i> Draft</span>`;

  const actionBtns = isReleased
    ? `<button class="btn btn-ghost btn-sm" onclick="reopenPayroll('${payroll.id}')"><i class="ti ti-edit"></i> Re-open</button>
       <button class="btn btn-amber btn-sm" onclick="printAllPayslips('${payroll.id}')"><i class="ti ti-printer"></i> Print All Payslips</button>`
    : `<button class="btn btn-ghost btn-sm" onclick="showAddToPayroll()"><i class="ti ti-user-plus"></i> Add Employee</button>
       <button class="btn btn-green btn-sm" onclick="releasePayroll('${payroll.id}')"><i class="ti ti-send"></i> Release Payroll</button>`;

  let grandTotal = 0;
  const cards = payroll.entries.map(entry => {
    const emp = data.employees.find(e => e.id === entry.employeeId);
    if (!emp) return '';
    const gross = calcEmpGross(entry);
    const net   = calcEmpNetPay(entry);
    grandTotal += net;

    const logRows = !(entry.logs || []).length
      ? `<tr><td colspan="4" style="text-align:center;padding:12px;color:var(--muted);font-size:12px">No entries yet. Click "+ Add Entry" below.</td></tr>`
      : (entry.logs || []).map(log => `
          <tr>
            <td style="font-size:12px">${log.date || ''}</td>
            <td style="font-weight:700;color:var(--amber)">${peso(log.amount)}</td>
            <td style="font-size:12px;color:var(--muted)">${esc(log.notes || '')}</td>
            <td style="text-align:center">
              ${isReleased ? '' : `<button class="btn btn-danger btn-sm" style="padding:2px 7px" onclick="deleteLogEntry('${emp.id}','${log.id}')"><i class="ti ti-trash"></i></button>`}
            </td>
          </tr>`).join('');

    const addFormHTML = isReleased ? '' : `
      <div class="pr-log-add" id="log-add-${emp.id}">
        <div class="pr-log-add-inner">
          <input type="date" id="log-date-${emp.id}" class="form-input" style="width:150px;padding:6px 10px" value="${new Date().toISOString().split('T')[0]}">
          <input type="number" id="log-amount-${emp.id}" class="pr-input" placeholder="Amount" min="0" style="width:110px">
          <input type="text" id="log-notes-${emp.id}" class="pr-notes-input" placeholder="Details (e.g. 5 t-shirts)…" style="flex:1;min-width:160px">
          <button class="btn btn-amber btn-sm" onclick="addLogEntry('${emp.id}')"><i class="ti ti-plus"></i> Add</button>
          <button class="btn btn-ghost btn-sm" onclick="hideLogForm('${emp.id}')">Cancel</button>
        </div>
      </div>`;

    const footerHTML = isReleased
      ? `<div class="pr-emp-foot">
           <span style="font-size:12px;color:var(--muted)">Deduction: ${peso(entry.deduction||0)}</span>
           <span style="margin-left:auto;font-size:12px;color:var(--muted)">Net Pay:</span>
           <span class="pr-emp-net" id="net-${emp.id}">${peso(net)}</span>
         </div>`
      : `<div class="pr-emp-foot">
           <button class="btn btn-ghost btn-sm" onclick="showLogForm('${emp.id}')"><i class="ti ti-plus"></i> Add Entry</button>
           <span style="margin-left:auto;font-size:12px;color:var(--muted)">Deduction:</span>
           <input type="number" class="pr-input" id="ded-${emp.id}" value="${entry.deduction||0}" min="0" style="width:90px" oninput="saveDeduction('${emp.id}',this.value)">
           <span style="font-size:12px;color:var(--muted)">Net Pay:</span>
           <span class="pr-emp-net" id="net-${emp.id}">${peso(net)}</span>
         </div>`;

    return `<div class="pr-emp-card" id="card-${emp.id}">
      <div class="pr-emp-head">
        <div>
          <strong>${esc(emp.name)}</strong>
          <span style="color:var(--muted);font-size:12px;margin-left:8px">${esc(emp.role||'—')}</span>
        </div>
        <div style="font-size:12px;color:var(--muted)">Gross: <span class="pr-emp-total" id="gross-${emp.id}">${peso(gross)}</span></div>
      </div>
      <div style="padding:0 2px">
        <table class="data-table" style="border:none">
          <thead><tr><th>Date</th><th>Amount</th><th>Details / Notes</th><th style="width:40px"></th></tr></thead>
          <tbody id="logs-${emp.id}">${logRows}</tbody>
        </table>
      </div>
      ${addFormHTML}
      ${footerHTML}
    </div>`;
  }).join('');

  const emptyMsg = payroll.entries.length === 0
    ? `<div class="empty-state"><i class="ti ti-users-off"></i><p>No employees for this week. Add employees first.</p></div>` : '';

  document.getElementById('pane-payroll').innerHTML = `
    <div class="week-nav">
      <button class="week-nav-btn" onclick="navigateWeek(-1)"><i class="ti ti-chevron-left"></i></button>
      <div style="flex:1;text-align:center">
        <div class="week-label">Week of ${weekLabel}</div>
      </div>
      ${statusBadge}
      <button class="week-nav-btn" onclick="navigateWeek(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    ${emptyMsg}
    ${payroll.entries.length > 0 ? `
    ${cards}
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <span style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Total Net Pay</span>
      <span style="font-size:22px;font-weight:800;color:var(--green)" id="pr-grand-total">${peso(grandTotal)}</span>
    </div>
    <div class="action-bar">${actionBtns}</div>` : ''}`;
}

function navigateWeek(dir) {
  curWeekStart = addDaysISO(curWeekStart, dir * 7);
  renderPayroll();
}

function showAddToPayroll() {
  const data    = getHRData();
  const payroll = data.payrolls.find(p => p.weekStart === curWeekStart);
  if (!payroll || payroll.status === 'released') return;
  const existing = new Set(payroll.entries.map(e => e.employeeId));
  const missing  = data.employees.filter(e => !existing.has(e.id));
  if (!missing.length) { toast('All employees are already in this week.', ''); return; }

  const options = missing.map(e =>
    `<option value="${e.id}">${esc(e.name)}${e.active ? '' : ' (inactive)'}</option>`
  ).join('');

  const existing_el = document.getElementById('add-to-payroll-bar');
  if (existing_el) { existing_el.remove(); return; } // toggle

  const bar = document.createElement('div');
  bar.id = 'add-to-payroll-bar';
  bar.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--surface);border:1px solid var(--amber-border);border-radius:10px;padding:12px 16px;';
  bar.innerHTML = `
    <i class="ti ti-user-plus" style="color:var(--amber);font-size:18px;flex-shrink:0"></i>
    <select id="add-emp-select" class="form-input" style="flex:1;max-width:280px;">${options}</select>
    <button class="btn btn-amber btn-sm" onclick="confirmAddToPayroll()"><i class="ti ti-plus"></i> Add to This Week</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('add-to-payroll-bar').remove()">Cancel</button>`;
  document.getElementById('pane-payroll').appendChild(bar);
}

function confirmAddToPayroll() {
  const sel = document.getElementById('add-emp-select');
  if (!sel) return;
  const empId = sel.value;
  const data  = getHRData();
  const idx   = data.payrolls.findIndex(p => p.weekStart === curWeekStart);
  if (idx === -1) return;
  if (!data.payrolls[idx].entries.find(e => e.employeeId === empId)) {
    data.payrolls[idx].entries.push({ employeeId: empId, logs: [], deduction: 0, netPay: 0 });
  }
  saveHRData(data);
  renderPayroll();
  const emp = data.employees.find(e => e.id === empId);
  toast((emp?.name || 'Employee') + ' added to this week.', 'ok');
}

function releasePayroll(payrollId) {
  if (!confirm('Release this payroll? It will be synced to Finance as an expense.')) return;
  const data = getHRData();
  const idx  = data.payrolls.findIndex(p => p.id === payrollId);
  if (idx === -1) return;
  data.payrolls[idx].entries.forEach(e => { e.netPay = calcEmpNetPay(e); });
  data.payrolls[idx].totalNetPay = data.payrolls[idx].entries.reduce((s, e) => s + e.netPay, 0);
  data.payrolls[idx].status      = 'released';
  data.payrolls[idx].releasedAt  = new Date().toISOString();
  saveHRData(data);
  syncPayrollToFinance(data.payrolls[idx]);
  toast('Payroll released and synced to Finance ✓', 'ok');
  renderPayroll();
}

function reopenPayroll(payrollId) {
  if (!confirm('Re-open this payroll? The Finance expense entry will be removed.')) return;
  const data = getHRData();
  const idx  = data.payrolls.findIndex(p => p.id === payrollId);
  if (idx === -1) return;
  data.payrolls[idx].status     = 'draft';
  data.payrolls[idx].releasedAt = null;
  saveHRData(data);
  syncPayrollToFinance(data.payrolls[idx]);
  toast('Payroll re-opened. Finance entry removed.', 'ok');
  renderPayroll();
}

// ── TAB 3: PAYSLIPS ───────────────────────────────────────────
function renderPayslips() {
  const data     = getHRData();
  const payrolls = data.payrolls.sort((a, b) => b.weekStart.localeCompare(a.weekStart));
  const pane     = document.getElementById('pane-payslips');

  if (!payrolls.length) {
    pane.innerHTML = `<div class="empty-state"><i class="ti ti-file-off"></i><p>No payrolls yet. Create one in Weekly Payroll.</p></div>`;
    return;
  }

  const options  = payrolls.map(p =>
    `<option value="${p.id}">${formatWeekLabel(p.weekStart, p.weekEnd)} ${p.status === 'released' ? '✓' : '(draft)'}</option>`
  ).join('');

  const selId    = pane.querySelector('.week-select')?.value || payrolls[0].id;
  const payroll  = data.payrolls.find(p => p.id === selId) || payrolls[0];

  const cards    = payroll.entries.map(entry => {
    const emp    = data.employees.find(e => e.id === entry.employeeId);
    if (!emp) return '';
    const dispNet = Array.isArray(entry.logs) ? calcEmpNetPay(entry) : (entry.netPay || 0);
    return `<div class="payslip-card" onclick="showPayslipModal('${emp.id}','${payroll.id}')">
      <div class="payslip-name">${esc(emp.name)}</div>
      <div class="payslip-role">${esc(emp.role || '—')}</div>
      <div class="payslip-lbl">Net Pay</div>
      <div class="payslip-net">${peso(dispNet)}</div>
    </div>`;
  }).join('');

  pane.innerHTML = `
    <div class="section-head">
      <div class="section-title"><i class="ti ti-file-invoice"></i> Payslips</div>
      <button class="btn btn-ghost btn-sm" onclick="printAllPayslips('${payroll.id}')"><i class="ti ti-printer"></i> Print All</button>
    </div>
    <select class="week-select" onchange="rerenderActive()" id="payslip-week-sel">${options}</select>
    ${cards ? `<div class="payslip-grid">${cards}</div>` : `<div class="empty-state"><i class="ti ti-users-off"></i><p>No entries in this payroll.</p></div>`}`;

  const sel = pane.querySelector('.week-select');
  if (sel) sel.value = selId;
}

function showPayslipModal(empId, payrollId) {
  const data    = getHRData();
  const emp     = data.employees.find(e => e.id === empId);
  const payroll = data.payrolls.find(p => p.id === payrollId);
  const entry   = payroll?.entries.find(e => e.employeeId === empId);
  if (!emp || !payroll || !entry) return;
  printData = { emp, payroll, entry };
  document.getElementById('payslip-preview-content').innerHTML = makePayslipInnerHTML(emp, payroll, entry);
  document.getElementById('payslip-modal').classList.add('open');
}

function closePayslipModal() {
  document.getElementById('payslip-modal').classList.remove('open');
  printData = null;
}

function makePayslipInnerHTML(emp, payroll, entry) {
  const isLogBased = Array.isArray(entry.logs);
  const weekLabel  = formatWeekLabel(payroll.weekStart, payroll.weekEnd);
  const p = n => '&#8369;' + (parseFloat(n)||0).toLocaleString('en-PH', {minimumFractionDigits:0, maximumFractionDigits:0});

  let earningsHTML, grossAmt, netAmt, deductAmt, notesStr;

  if (isLogBased) {
    grossAmt  = calcEmpGross(entry);
    deductAmt = parseFloat(entry.deduction) || 0;
    netAmt    = calcEmpNetPay(entry);
    notesStr  = '';
    const logRows = (entry.logs || []).length
      ? (entry.logs || []).map(log =>
          `<tr><td style="padding:4px 10px">${esc(log.date||'')}</td><td style="padding:4px 10px;font-size:10px;color:#555">${esc(log.notes||'')}</td><td style="padding:4px 10px;text-align:right">${p(log.amount)}</td></tr>`
        ).join('')
      : `<tr><td colspan="3" style="padding:6px 10px;color:#999;font-size:11px">No entries</td></tr>`;
    earningsHTML = `
      <table width="100%" style="border-collapse:collapse;border:1px solid #ddd;">
        <tr><td colspan="3" style="background:#f5f5f5;padding:6px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #ddd;">EARNINGS LOG</td></tr>
        <tr>
          <th style="padding:4px 10px;text-align:left;font-size:10px;background:#fafafa;border-bottom:1px solid #eee">Date</th>
          <th style="padding:4px 10px;text-align:left;font-size:10px;background:#fafafa;border-bottom:1px solid #eee">Details</th>
          <th style="padding:4px 10px;text-align:right;font-size:10px;background:#fafafa;border-bottom:1px solid #eee">Amount</th>
        </tr>
        ${logRows}
        <tr><td colspan="2" style="padding:4px 10px;font-weight:700;border-top:1px solid #ddd">Gross Pay</td><td style="padding:4px 10px;text-align:right;font-weight:700;border-top:1px solid #ddd">${p(grossAmt)}</td></tr>
      </table>`;
  } else {
    grossAmt  = (entry.basicPay || 0) + (entry.otherPay || 0);
    deductAmt = entry.otherDeduction || 0;
    netAmt    = entry.netPay || 0;
    notesStr  = entry.notes || '';
    earningsHTML = `
      <table width="100%" style="border-collapse:collapse;border:1px solid #ddd;">
        <tr><td colspan="2" style="background:#f5f5f5;padding:6px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #ddd;">EARNINGS</td></tr>
        <tr><td style="padding:4px 10px">Basic Pay</td><td style="padding:4px 10px;text-align:right">${p(entry.basicPay)}</td></tr>
        <tr><td style="padding:4px 10px">Other Pay</td><td style="padding:4px 10px;text-align:right">${p(entry.otherPay)}</td></tr>
        <tr><td colspan="2" style="border-top:1px solid #ddd;height:1px"></td></tr>
        <tr><td style="padding:4px 10px;font-weight:700">Gross Pay</td><td style="padding:4px 10px;text-align:right;font-weight:700">${p(grossAmt)}</td></tr>
      </table>`;
  }

  return `
    <div style="font-family:Arial,sans-serif;font-size:12px;color:#111;">
      <div style="background:#0f1b35;color:white;padding:12px 18px;">
        <div style="font-size:15px;font-weight:900;letter-spacing:2px;">SIKHAY CREATIVES &nbsp;·&nbsp; SIKHAY PREMIUM APPAREL</div>
        <div style="font-size:10px;opacity:.7;letter-spacing:1.5px;margin-top:3px;">Dasmariñas, Cavite &nbsp;·&nbsp; PAYSLIP</div>
      </div>
      <table width="100%" style="border-collapse:collapse;border:2px solid #0f1b35;font-size:11px;">
        <tr>
          <td style="padding:7px 10px;border:1px solid #ddd;width:50%"><strong>Employee:</strong> ${esc(emp.name)}</td>
          <td style="padding:7px 10px;border:1px solid #ddd"><strong>Week:</strong> ${weekLabel}</td>
        </tr>
        <tr>
          <td style="padding:7px 10px;border:1px solid #ddd"><strong>Role:</strong> ${esc(emp.role||'—')}</td>
          <td style="padding:7px 10px;border:1px solid #ddd"><strong>Pay Type:</strong> ${emp.payType==='fixed'?'Fixed Weekly':emp.payType==='manual'?'Manual Input':'Daily Rate'}</td>
        </tr>
      </table>
      <div style="margin-top:10px">${earningsHTML}</div>
      ${deductAmt > 0 ? `
      <table width="100%" style="border-collapse:collapse;margin-top:6px;font-size:11px;">
        <tr><td style="padding:4px 10px;border:1px solid #ddd">Deduction</td><td style="padding:4px 10px;text-align:right;border:1px solid #ddd">${p(deductAmt)}</td></tr>
      </table>` : ''}
      <table width="100%" style="border-collapse:collapse;background:#0f1b35;color:white;margin-top:10px;">
        <tr><td style="padding:10px;font-size:14px;font-weight:700;letter-spacing:1px;text-align:center;">NET PAY: ${p(netAmt)}</td></tr>
      </table>
      ${notesStr ? `<table width="100%" style="border-collapse:collapse;margin-top:10px;font-size:11px;">
        <tr><td style="padding:6px 10px;background:#f5f5f5;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border:1px solid #ddd;">WORK DETAILS</td></tr>
        <tr><td style="padding:7px 10px;border:1px solid #ddd;">${esc(notesStr)}</td></tr>
      </table>` : ''}
      <table width="100%" style="border-collapse:collapse;margin-top:12px;font-size:11px;color:#666;">
        <tr>
          <td style="padding:6px 10px;border-top:1px solid #bbb;width:55%">Received by: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
          <td style="padding:6px 10px;border-top:1px solid #bbb">Date: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
        </tr>
      </table>
    </div>`;
}

function printCurrentPayslip() {
  if (!printData) return;
  const { emp, payroll, entry } = printData;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>*{box-sizing:border-box;margin:0;padding:0;} body{font-family:Arial,sans-serif;font-size:12px;background:white;color:#111;}
@media print{@page{margin:.8cm;size:A5 landscape;}}</style></head>
<body>${makePayslipInnerHTML(emp, payroll, entry)}</body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

function printAllPayslips(payrollId) {
  const data    = getHRData();
  const payroll = data.payrolls.find(p => p.id === payrollId);
  if (!payroll) return;
  const blocks = payroll.entries.map(entry => {
    const emp = data.employees.find(e => e.id === entry.employeeId);
    return emp ? makePayslipInnerHTML(emp, payroll, entry) : '';
  }).filter(Boolean).join('<div style="page-break-after:always;"></div>');
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>*{box-sizing:border-box;margin:0;padding:0;} body{font-family:Arial,sans-serif;font-size:12px;background:white;color:#111;}
@media print{@page{margin:.8cm;size:A5 landscape;}}</style></head>
<body>${blocks}</body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

// ── TAB 4: HISTORY ────────────────────────────────────────────
function renderHistory() {
  const data     = getHRData();
  const payrolls = [...data.payrolls].sort((a, b) => b.weekStart.localeCompare(a.weekStart));
  const pane     = document.getElementById('pane-history');

  if (!payrolls.length) {
    pane.innerHTML = `<div class="empty-state"><i class="ti ti-history"></i><p>No payroll records yet.</p></div>`;
    return;
  }

  const items = payrolls.map(p => {
    const weekLabel = formatWeekLabel(p.weekStart, p.weekEnd);
    const empCount  = p.entries.length;
    const badge     = p.status === 'released'
      ? `<span class="badge badge-released"><i class="ti ti-check"></i> Released</span>`
      : `<span class="badge badge-draft"><i class="ti ti-pencil"></i> Draft</span>`;

    const entryRows = p.entries.map(entry => {
      const emp = data.employees.find(e => e.id === entry.employeeId);
      if (!emp) return '';
      const isLogBased = Array.isArray(entry.logs);
      const gross      = isLogBased ? calcEmpGross(entry)    : ((entry.basicPay||0) + (entry.otherPay||0));
      const deduct     = isLogBased ? (entry.deduction||0)   : (entry.otherDeduction||0);
      const net        = isLogBased ? calcEmpNetPay(entry)   : (entry.netPay||0);
      const entryCount = isLogBased ? ((entry.logs||[]).length + ' log' + ((entry.logs||[]).length !== 1 ? 's' : '')) : 'legacy';
      return `<tr>
        <td>${esc(emp.name)}</td>
        <td style="color:var(--muted);font-size:12px">${esc(emp.role||'—')}</td>
        <td style="font-size:12px;color:var(--muted)">${entryCount}</td>
        <td>${peso(gross)}</td>
        <td>${peso(deduct)}</td>
        <td class="net-pay-cell">${peso(net)}</td>
      </tr>`;
    }).join('');

    return `<div class="history-item" id="hi-${p.id}">
      <div class="history-head" onclick="toggleHistoryItem('${p.id}')">
        <div>
          <div class="history-week">Week of ${weekLabel}</div>
          <div class="history-meta">${empCount} employee${empCount!==1?'s':''}</div>
        </div>
        ${badge}
        <div class="history-total">${peso(p.totalNetPay)}</div>
        ${p.status==='released'
          ? `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();printAllPayslips('${p.id}')"><i class="ti ti-printer"></i> Print</button>`
          : ''}
        <i class="ti ti-chevron-down" style="color:var(--muted);font-size:16px"></i>
      </div>
      <div class="history-body" id="hb-${p.id}">
        <div class="table-wrap" style="margin-top:0;border:none;border-radius:0">
          <table class="data-table">
            <thead><tr><th>Employee</th><th>Role</th><th>Entries</th><th>Gross</th><th>Deduction</th><th>Net Pay</th></tr></thead>
            <tbody>${entryRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');

  pane.innerHTML = `
    <div class="section-head">
      <div class="section-title"><i class="ti ti-history"></i> Payroll History</div>
    </div>
    ${items}`;
}

function toggleHistoryItem(payrollId) {
  const body = document.getElementById('hb-' + payrollId);
  if (body) body.classList.toggle('open');
}

// ── TAB 5: REPORTS ────────────────────────────────────────────
function renderReports() {
  const data      = getHRData();
  const released  = data.payrolls.filter(p => p.status === 'released');
  const now       = new Date();
  const thisMonth = released.filter(p => {
    const d = new Date(p.weekEnd + 'T12:00:00');
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  const thisYear = released.filter(p => {
    return new Date(p.weekEnd + 'T12:00:00').getFullYear() === now.getFullYear();
  });
  const totalMonth = thisMonth.reduce((s, p) => s + (p.totalNetPay || 0), 0);
  const totalYear  = thisYear.reduce((s, p) => s + (p.totalNetPay || 0), 0);
  const bigWeek    = [...released].sort((a,b) => (b.totalNetPay||0) - (a.totalNetPay||0))[0];
  const activeEmps = data.employees.filter(e => e.active);

  // Last 6 months data
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d     = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const label = d.toLocaleDateString('en-PH', { month: 'short', year: '2-digit' });
    const total = released
      .filter(p => {
        const e = new Date(p.weekEnd + 'T12:00:00');
        return e.getFullYear() === d.getFullYear() && e.getMonth() === d.getMonth();
      })
      .reduce((s, p) => s + (p.totalNetPay || 0), 0);
    months.push({ label, total });
  }

  // Last 4 released payrolls per-employee data
  const last4 = [...released].sort((a,b) => b.weekStart.localeCompare(a.weekStart)).slice(0, 4).reverse();
  const empColors  = ['#f59e0b','#22c55e','#3b82f6','#a855f7','#ef4444','#06b6d4','#f97316','#84cc16'];
  const empDatasets = activeEmps.map((emp, i) => ({
    label: emp.name,
    data: last4.map(p => (p.entries.find(e => e.employeeId === emp.id) || {}).netPay || 0),
    backgroundColor: empColors[i % empColors.length] + 'aa',
    borderColor:     empColors[i % empColors.length],
    borderWidth: 2, borderRadius: 4
  }));

  document.getElementById('pane-reports').innerHTML = `
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Active Employees</div>
        <div class="stat-value">${activeEmps.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">This Month</div>
        <div class="stat-value">${peso(totalMonth)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">YTD Total</div>
        <div class="stat-value">${peso(totalYear)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Biggest Week</div>
        <div class="stat-value">${bigWeek ? peso(bigWeek.totalNetPay) : '—'}</div>
        <div class="stat-sub">${bigWeek ? formatWeekLabel(bigWeek.weekStart, bigWeek.weekEnd) : 'No released payrolls yet'}</div>
      </div>
    </div>
    <div class="reports-grid">
      <div class="chart-card">
        <div class="chart-title"><i class="ti ti-chart-bar"></i> Monthly Payroll (Last 6 Months)</div>
        <div class="chart-wrap"><canvas id="chart-monthly-hr"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title"><i class="ti ti-chart-bar"></i> Per-Employee (Last 4 Weeks)</div>
        <div class="chart-wrap"><canvas id="chart-emp-hr"></canvas></div>
      </div>
    </div>`;

  // Monthly bar chart
  const barCtx = document.getElementById('chart-monthly-hr');
  if (barCtx) {
    const ex = Chart.getChart('chart-monthly-hr');
    if (ex) ex.destroy();
    new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: months.map(m => m.label),
        datasets: [{ label: 'Total Net Pay', data: months.map(m => m.total),
          backgroundColor: '#22c55e55', borderColor: '#22c55e', borderWidth: 2, borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#888', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#888', font: { size: 11 } }, grid: { color: '#2a2a2a' } },
          y: { ticks: { color: '#888', font: { size: 11 }, callback: v => '₱' + v.toLocaleString('en-PH') }, grid: { color: '#2a2a2a' } }
        }
      }
    });
  }

  // Per-employee grouped bar chart
  const empCtx = document.getElementById('chart-emp-hr');
  if (empCtx) {
    const ex = Chart.getChart('chart-emp-hr');
    if (ex) ex.destroy();
    new Chart(empCtx, {
      type: 'bar',
      data: {
        labels: last4.length ? last4.map(p => formatWeekLabel(p.weekStart, p.weekEnd)) : ['No data'],
        datasets: empDatasets.length ? empDatasets : [{ label: 'No employees', data: [0], backgroundColor: '#2a2a2a' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#888', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#888', font: { size: 10 } }, grid: { color: '#2a2a2a' } },
          y: { ticks: { color: '#888', font: { size: 11 }, callback: v => '₱' + v.toLocaleString('en-PH') }, grid: { color: '#2a2a2a' } }
        }
      }
    });
  }
}
